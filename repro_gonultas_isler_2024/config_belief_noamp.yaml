# Environment
arena_size: 16.0          # meters (square arena)
max_steps: 400
capture_radius: 0.15      # agent radius c, capture at d <= 2c
sim_dt: 0.1               # simulation timestep (seconds)

# Pursuer (bicycle model)
pursuer:
  wheelbase: 0.30
  v_max: 2.5
  v_min: -1.0
  delta_max: 0.34
  delta_min: -0.34
  accel_max: 2.0
  accel_min: -2.0
  steer_rate_max: 3.2
  steer_rate_min: -3.2
  fov_angle: 2.094          # 2pi/3 radians
  fov_range: 6.0

# Evader (point-mass)
evader:
  v_max: 1.5
  v_min: -1.5
  accel_max: 9.81
  accel_min: -9.81
  fov_angle: 6.283           # 2pi radians (omnidirectional)
  fov_range: 1000.0          # effectively infinite

# Reward
reward:
  lambda_capture: 1000
  lambda_time: 1
  lambda_distance: 1

# Global toggles
use_belief: true
use_amp: false

# MADDPG
maddpg:
  episodes: 20000
  parallel_envs: 8
  replay_buffer_size: 100000
  batch_size: 512
  actor_lr: 0.0005
  critic_lr: 0.0005
  gamma: 0.99
  tau: 0.005
  exploration_sigma: 0.1
  hidden_dim: 128
  frame_stack: 2
  frame_skip: 2
  update_freq: 1

# BiMDN
bimdn:
  history_length: 200
  downsample_factor: 10
  lstm_hidden: 128
  feature_dim: 32
  num_components: 3
  belief_buffer_size: 25000
  belief_warmup: 10000
  belief_update_freq: 10
  belief_batch_size: 256
  belief_lr: 0.002

# Curriculum
curriculum:
  t_end_ratio: 0.1           # fraction of total episodes (T/10 = 2000 ep)
  fov_start: 6.283           # 2pi
  fov_end: 2.094             # 2pi/3
  evader_vmax_start: 0.0
  evader_vmax_end: 1.5

# Evaluation
eval:
  checkpoint_freq: 250
  eval_episodes: 500

# Logging
log_dir: "./runs_belief_noamp"
output_dir: "./results_belief_noamp"
