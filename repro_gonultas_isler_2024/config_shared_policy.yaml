# Shared Policy with Role Conditioning — Symmetric Point-Mass
# Both agents share the same neural network π(s, role)
# Role = 0.0: pursuer, Role = 1.0: evader
symmetric: true
shared_policy: true

arena_size: 16.0
max_steps: 400
capture_radius: 0.15
sim_dt: 0.1

# Shared agent parameters (point-mass, symmetric)
agent:
  v_max: 1.5
  v_min: -1.5
  accel_max: 9.81
  accel_min: -9.81
  fov_angle: 2.094
  fov_range: 6.0

# Reward
reward:
  lambda_capture: 1000
  lambda_time: 1
  lambda_distance: 1

# Global toggles
use_belief: false
use_amp: true
use_compile: false

# MADDPG — Shared Actor with Role Conditioning
maddpg:
  episodes: 10000        # More episodes (shared policy may converge slower)
  parallel_envs: 2
  replay_buffer_size: 100000
  batch_size: 1024

  # Symmetric learning rates (same for both agents)
  actor_lr: 0.0005
  critic_lr: 0.0005
  hidden_dim: 128

  gamma: 0.99
  tau: 0.005
  exploration_sigma: 0.15  # Higher exploration (need diverse strategies for both roles)
  ema_tau: 0.001

  # Frame stacking
  frame_stack: 2
  frame_skip: 2
  update_freq: 1

  # vis_reward for pursuer LOS maintenance
  w_vis: 0.1

# BiMDN (disabled for shared policy experiments)
bimdn:
  history_length: 200
  downsample_factor: 10
  lstm_hidden: 128
  feature_dim: 32
  num_components: 3
  belief_buffer_size: 25000
  belief_warmup: 10000
  belief_update_freq: 10
  belief_batch_size: 256
  belief_lr: 0.002

# Curriculum (disabled)
curriculum:
  t_end_ratio: 0.0
  fov_start: 2.094
  fov_end: 2.094
  evader_vmax_start: 1.5
  evader_vmax_end: 1.5

# Evaluation
eval:
  checkpoint_freq: 250
  eval_episodes: 100

# Logging
log_dir: "./runs_shared"
output_dir: "./results_shared"

# Seed (overridden by launch script)
seed: 0
